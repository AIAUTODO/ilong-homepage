<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code · iLONG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8D%89%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="tools.css">
</head><body>
<div class="wrap">

  <div class="hd">
    <div class="lang">
      <button type="button" data-lang="en" class="on">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
    <a class="back" href="index.html">← <span data-zh="返回首页" data-en="Back to home">返回首页</span></a>
    <h1 data-zh="二维码生成" data-en="QR Code Generator">二维码生成</h1>
    <div class="desc" data-zh="把网址或任意文字生成二维码，可调尺寸与纠错级别，支持下载 PNG。全部在浏览器本地生成。" data-en="Turn a URL or any text into a QR code. Adjustable size and error correction, PNG download. Generated locally.">把网址或任意文字生成二维码，可调尺寸与纠错级别，支持下载 PNG。全部在浏览器本地生成。</div>
  </div>

  <div class="panel">
    <div class="two">
      <div>
        <h3 data-zh="内容" data-en="Content">内容</h3>
        <textarea id="in" spellcheck="false" style="min-height:110px" data-ph-zh="输入网址或文字，如 https://www.ilong.dpdns.org" data-ph-en="Enter a URL or text, e.g. https://www.ilong.dpdns.org">https://www.ilong.dpdns.org</textarea>

        <h3 style="margin-top:16px" data-zh="尺寸" data-en="Size">尺寸</h3>
        <select id="size">
          <option value="256">256 × 256</option>
          <option value="320" selected>320 × 320</option>
          <option value="480">480 × 480</option>
          <option value="640">640 × 640</option>
          <option value="900">900 × 900</option>
        </select>

        <h3 style="margin-top:16px" data-zh="纠错级别" data-en="Error correction">纠错级别</h3>
        <select id="ec">
          <option value="L">L — 7%</option>
          <option value="M" selected>M — 15%</option>
          <option value="Q">Q — 25%</option>
          <option value="H">H — 30%</option>
        </select>

        <div class="btns">
          <button class="btn primary" id="gen" data-zh="生成二维码" data-en="Generate">生成二维码</button>
          <button class="btn ghost" id="dl" data-zh="下载 PNG" data-en="Download PNG">下载 PNG</button>
        </div>
        <div class="hint" id="msg"></div>
      </div>
      <div>
        <h3 data-zh="预览" data-en="Preview">预览</h3>
        <div class="qrbox" id="box"><span class="qrempty" data-zh="点击左侧「生成二维码」" data-en="Click “Generate” on the left">点击左侧「生成二维码」</span></div>
      </div>
    </div>
  </div>

  <div class="ft"><a href="index.html">www.ilong.dpdns.org</a></div>
</div>

<script src="tools.js"></script>
<script src="qrcode.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var T = window.IlongTools;
  var currentCanvas = null;

  function clearBox(){
    var b = $("box");
    b.innerHTML = '<span class="qrempty">' + (T.lang()==="zh"?"点击左侧「生成二维码」":"Click “Generate” on the left") + '</span>';
    currentCanvas = null;
  }

  function generate(){
    var text = $("in").value;
    if (!text){ clearBox(); $("msg").innerHTML = '<span class="err">' + (T.lang()==="zh"?"请输入内容":"Please enter content") + '</span>'; return; }
    var px = parseInt($("size").value, 10);
    var ec = $("ec").value;

    try {
      var qr = qrcode(0, ec);
      qr.addData(text);
      qr.make();

      var modCount = qr.getModuleCount();
      var quiet = 4; // 静区，单位模块
      var total = modCount + quiet * 2;
      var cell = Math.floor(px / total);
      if (cell < 2) cell = 2;
      var realSize = cell * total;

      var cv = document.createElement("canvas");
      cv.width = realSize; cv.height = realSize;
      var ctx = cv.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, realSize, realSize);
      ctx.fillStyle = "#000000";
      for (var r = 0; r < modCount; r++){
        for (var c = 0; c < modCount; c++){
          if (qr.isDark(r, c)){
            ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
          }
        }
      }

      var b = $("box");
      b.innerHTML = "";
      b.appendChild(cv);
      currentCanvas = cv;

      $("msg").innerHTML = '<span class="ok">✓ ' + (T.lang()==="zh"
        ? ("已生成 " + realSize + "×" + realSize + " px，模块 " + modCount + "×" + modCount)
        : (realSize + "×" + realSize + " px, modules " + modCount + "×" + modCount)) + '</span>';
    } catch(e){
      clearBox();
      $("msg").innerHTML = '<span class="err">' + (T.lang()==="zh"?"生成失败：内容过长，请缩短或降低纠错级别":"Failed: content too long, shorten it or lower error correction") + '</span>';
    }
  }

  $("gen").addEventListener("click", generate);
  $("dl").addEventListener("click", function(){
    if (!currentCanvas){ $("msg").innerHTML = '<span class="err">' + (T.lang()==="zh"?"请先生成二维码":"Generate a code first") + '</span>'; return; }
    var url = currentCanvas.toDataURL("image/png");
    var a = document.createElement("a");
    a.href = url; a.download = "qrcode.png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });

  // 首次进入自动生成
  window.onLangChange = function(){
    if (currentCanvas) return;
    clearBox();
  };

  window.addEventListener("load", function(){
    clearBox();
    generate();
  });
})();
</script>
</body></html>
