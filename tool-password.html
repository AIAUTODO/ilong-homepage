<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Generator · iLONG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8D%89%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="tools.css">
</head><body>
<div class="wrap">

  <div class="hd">
    <div class="lang">
      <button type="button" data-lang="en" class="on">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
    <a class="back" href="index.html">← <span data-zh="返回首页" data-en="Back to home">返回首页</span></a>
    <h1 data-zh="随机密码生成" data-en="Password Generator">随机密码生成</h1>
    <div class="desc" data-zh="使用浏览器加密随机源生成强密码，可选长度与字符类型，实时显示熵值强度。密码不会离开本机。" data-en="Generate strong passwords with the browser's cryptographic RNG. Adjustable length and character sets, live entropy strength. Never leaves your device.">使用浏览器加密随机源生成强密码，可选长度与字符类型，实时显示熵值强度。密码不会离开本机。</div>
  </div>

  <div class="panel">
    <h3 data-zh="密码" data-en="Password">密码</h3>
    <div class="pwdout" id="pwd">—</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="hint" id="strength"></div>

    <div class="btns">
      <button class="btn primary" id="gen" data-zh="重新生成" data-en="Regenerate">重新生成</button>
      <button class="btn ghost" id="cp" data-zh="复制" data-en="Copy">复制</button>
    </div>

    <h3 style="margin-top:22px" data-zh="长度" data-en="Length">长度</h3>
    <div style="display:flex;gap:14px;align-items:center">
      <input type="range" id="len" min="4" max="64" value="16" style="flex:1;cursor:pointer">
      <b id="lenv" style="font-family:Consolas,monospace;font-size:15px;min-width:36px;text-align:right">16</b>
    </div>

    <h3 style="margin-top:20px" data-zh="字符类型" data-en="Character sets">字符类型</h3>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#4b5563;cursor:pointer">
        <input type="checkbox" id="c-lower" checked style="width:auto;cursor:pointer">
        <span data-zh="小写字母 a-z" data-en="Lowercase a-z">小写字母 a-z</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#4b5563;cursor:pointer">
        <input type="checkbox" id="c-upper" checked style="width:auto;cursor:pointer">
        <span data-zh="大写字母 A-Z" data-en="Uppercase A-Z">大写字母 A-Z</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#4b5563;cursor:pointer">
        <input type="checkbox" id="c-digit" checked style="width:auto;cursor:pointer">
        <span data-zh="数字 0-9" data-en="Digits 0-9">数字 0-9</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#4b5563;cursor:pointer">
        <input type="checkbox" id="c-sym" checked style="width:auto;cursor:pointer">
        <span data-zh="符号 !@#$%…" data-en="Symbols !@#$%…">符号 !@#$%…</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#4b5563;cursor:pointer">
        <input type="checkbox" id="c-amb" style="width:auto;cursor:pointer">
        <span data-zh="排除易混字符 0O1lI" data-en="Exclude ambiguous 0O1lI">排除易混字符 0O1lI</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#4b5563;cursor:pointer">
        <input type="checkbox" id="c-multi" style="width:auto;cursor:pointer">
        <span data-zh="一次生成 5 条" data-en="Generate 5 at once">一次生成 5 条</span>
      </label>
    </div>

    <div class="hint" id="extra" style="margin-top:12px"></div>
    <div class="panel" id="listbox" style="display:none;margin:14px 0 0;padding:14px 16px;box-shadow:none;border:1px solid #eef0f3"></div>
  </div>

  <div class="ft"><a href="index.html">www.ilong.dpdns.org</a></div>
</div>

<script src="tools.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var T = window.IlongTools;
  var current = [];

  var SETS = {
    lower: "abcdefghijklmnopqrstuvwxyz",
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    digit: "0123456789",
    sym:   "!@#$%^&*()-_=+[]{};:,.?/",
    amb:   "0O1lI|`'\""
  };

  function picked(){
    var s = "";
    if ($("c-lower").checked) s += SETS.lower;
    if ($("c-upper").checked) s += SETS.upper;
    if ($("c-digit").checked) s += SETS.digit;
    if ($("c-sym").checked)   s += SETS.sym;
    if ($("c-amb").checked){
      var bad = SETS.amb.split("");
      s = s.split("").filter(function(ch){ return bad.indexOf(ch) < 0; }).join("");
    }
    return s;
  }

  // 无偏随机整数（拒绝采样）
  function randInt(max){
    var limit = Math.floor(0xFFFFFFFF / max) * max;
    var arr = new Uint32Array(1);
    var v;
    do { crypto.getRandomValues(arr); v = arr[0]; } while (v >= limit);
    return v % max;
  }

  function makeOne(pool, len){
    var out = "";
    for (var i = 0; i < len; i++) out += pool[randInt(pool.length)];
    return out;
  }

  function entropy(poolSize, len){
    return Math.round(len * Math.log2(poolSize) * 10) / 10;
  }

  function barFor(bits){
    if (bits < 40) return { w: 22, c: "#c0392b", l: T.lang()==="zh" ? "弱" : "Weak" };
    if (bits < 60) return { w: 44, c: "#d68910", l: T.lang()==="zh" ? "中" : "Fair" };
    if (bits < 80) return { w: 68, c: "#2e86de", l: T.lang()==="zh" ? "强" : "Strong" };
    if (bits < 120) return { w: 86, c: "#0f9d58", l: T.lang()==="zh" ? "很强" : "Very strong" };
    return { w: 100, c: "#0b7a43", l: T.lang()==="zh" ? "极强" : "Excellent" };
  }

  function generate(){
    var pool = picked();
    var len = parseInt($("len").value, 10);
    $("lenv").textContent = len;

    if (!pool){
      $("pwd").textContent = "—";
      $("strength").innerHTML = '<span class="err">' + (T.lang()==="zh"?"请至少勾选一种字符类型":"Select at least one character set") + '</span>';
      $("bar").style.width = "0%";
      $("listbox").style.display = "none";
      current = [];
      return;
    }

    var bits = entropy(pool.length, len);
    var b = barFor(bits);
    $("bar").style.width = b.w + "%";
    $("bar").style.background = b.c;
    $("strength").innerHTML = '<span style="color:' + b.c + ';font-weight:600">' + b.l + '</span> · ' +
      (T.lang()==="zh" ? ("熵 " + bits + " 比特，" + pool.length + " 种字符可选")
                       : (bits + " bits of entropy, " + pool.length + " chars in pool"));

    var multi = $("c-multi").checked;
    if (multi){
      current = [];
      var rows = "";
      for (var i = 0; i < 5; i++){
        var p = makeOne(pool, len);
        current.push(p);
        rows += '<div class="colrow" style="margin-bottom:6px"><b style="font-size:13px;letter-spacing:.3px">' + p +
                '</b><button data-i="' + i + '" data-zh="复制" data-en="Copy">' +
                (T.lang()==="zh"?"复制":"Copy") + '</button></div>';
      }
      $("listbox").innerHTML = rows;
      $("listbox").style.display = "block";
      $("pwd").textContent = current[0];
    } else {
      $("listbox").style.display = "none";
      current = [makeOne(pool, len)];
      $("pwd").textContent = current[0];
    }
  }

  $("gen").addEventListener("click", generate);
  $("len").addEventListener("input", function(){ $("lenv").textContent = this.value; generate(); });
  ["c-lower","c-upper","c-digit","c-sym","c-amb","c-multi"].forEach(function(id){
    $(id).addEventListener("change", generate);
  });

  $("cp").addEventListener("click", function(){
    if (!current.length || $("pwd").textContent === "—") return;
    T.copy($("pwd").textContent, this);
  });

  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-i]") : null;
    if (!b) return;
    var i = parseInt(b.getAttribute("data-i"), 10);
    if (current[i]) T.copy(current[i], b);
  });

  window.onLangChange = function(){ generate(); };
  generate();
})();
</script>
</body></html>
