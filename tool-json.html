<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Formatter · iLONG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8D%89%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="tools.css">
<style>
.jk{color:#0550ae}
.js{color:#0a7d3e}
.jn{color:#b45309}
.jb{color:#8250df}
.jp{color:#6b7280}
</style>
</head><body>
<div class="wrap">

  <div class="hd">
    <div class="lang">
      <button type="button" data-lang="en" class="on">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
    <a class="back" href="index.html">← <span data-zh="返回首页" data-en="Back to home">返回首页</span></a>
    <h1 data-zh="JSON 格式化" data-en="JSON Formatter">JSON 格式化</h1>
    <div class="desc" data-zh="粘贴 JSON，自动展开缩进与语法着色。支持压缩、校验、排序键名。全部在浏览器本地完成。" data-en="Paste JSON to format, validate and colorize. Compress, validate and sort keys. Everything runs locally in your browser.">粘贴 JSON，自动展开缩进与语法着色。支持压缩、校验、排序键名。全部在浏览器本地完成。</div>
  </div>

  <div class="panel">
    <div class="two">
      <div>
        <h3 data-zh="输入" data-en="Input">输入</h3>
        <textarea id="in" spellcheck="false" data-ph-zh="在此粘贴 JSON…" data-ph-en="Paste JSON here…"></textarea>
        <div class="btns">
          <button class="btn primary" id="fmt" data-zh="格式化" data-en="Format">格式化</button>
          <button class="btn ghost" id="min" data-zh="压缩" data-en="Minify">压缩</button>
          <button class="btn ghost" id="sort" data-zh="排序键名" data-en="Sort keys">排序键名</button>
          <button class="btn ghost" id="clr" data-zh="清空" data-en="Clear">清空</button>
        </div>
      </div>
      <div>
        <h3 data-zh="结果" data-en="Output">结果</h3>
        <div class="out" id="out"></div>
        <div class="btns">
          <button class="btn ghost" id="cp" data-zh="复制结果" data-en="Copy result">复制结果</button>
          <button class="btn ghost" id="dl" data-zh="下载 .json" data-en="Download .json">下载 .json</button>
        </div>
      </div>
    </div>
    <div class="hint" id="msg"></div>
  </div>

  <div class="ft"><a href="index.html">www.ilong.dpdns.org</a></div>
</div>

<script src="tools.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var T = window.IlongTools;
  var lastResult = "";

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // 带语法着色的 JSON 渲染
  function highlight(json){
    var out = "";
    var re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
    var last = 0, m;
    while ((m = re.exec(json)) !== null){
      out += escapeHtml(json.slice(last, m.index));
      if (m[1] !== undefined){
        if (m[2] !== undefined){
          out += '<span class="jk">' + escapeHtml(m[1]) + '</span>' + '<span class="jp">' + escapeHtml(m[2]) + '</span>';
        } else {
          out += '<span class="js">' + escapeHtml(m[1]) + '</span>';
        }
      } else if (m[3] !== undefined){
        out += '<span class="jb">' + escapeHtml(m[3]) + '</span>';
      } else if (m[4] !== undefined){
        out += '<span class="jn">' + escapeHtml(m[4]) + '</span>';
      }
      last = re.lastIndex;
    }
    out += escapeHtml(json.slice(last));
    return out;
  }

  function show(text, isErr){
    var o = $("out");
    if (isErr){
      o.innerHTML = '<span class="err">' + escapeHtml(text) + '</span>';
      lastResult = "";
    } else {
      o.innerHTML = highlight(text);
      lastResult = text;
    }
  }

  function parse(){
    var raw = $("in").value.trim();
    if (!raw){ $("msg").textContent = ""; return null; }
    try {
      return { data: JSON.parse(raw), raw: raw };
    } catch(e){
      show("JSON 解析失败：" + e.message, true);
      $("msg").innerHTML = '<span class="err">' + escapeHtml(e.message) + '</span>';
      return null;
    }
  }

  function fmt(){
    var p = parse(); if (!p) return;
    var s = JSON.stringify(p.data, null, 2);
    show(s);
    var lines = s.split("\n").length;
    $("msg").innerHTML = '<span class="ok">✓ ' +
      (T.lang() === "zh" ? ("格式化成功，" + lines + " 行，" + s.length + " 字符") :
                           ("Formatted — " + lines + " lines, " + s.length + " chars")) + '</span>';
  }

  function minify(){
    var p = parse(); if (!p) return;
    var s = JSON.stringify(p.data);
    show(s);
    $("msg").innerHTML = '<span class="ok">✓ ' +
      (T.lang() === "zh" ? ("压缩完成，" + s.length + " 字符（原 " + p.raw.length + "）") :
                           ("Minified — " + s.length + " chars (was " + p.raw.length + ")")) + '</span>';
  }

  function sortKeys(){
    var p = parse(); if (!p) return;
    function walk(v){
      if (Array.isArray(v)) return v.map(walk);
      if (v && typeof v === "object"){
        var o = {};
        Object.keys(v).sort().forEach(function(k){ o[k] = walk(v[k]); });
        return o;
      }
      return v;
    }
    var s = JSON.stringify(walk(p.data), null, 2);
    show(s);
    $("msg").innerHTML = '<span class="ok">✓ ' +
      (T.lang() === "zh" ? "键名已按字母排序" : "Keys sorted alphabetically") + '</span>';
  }

  $("fmt").addEventListener("click", fmt);
  $("min").addEventListener("click", minify);
  $("sort").addEventListener("click", sortKeys);
  $("clr").addEventListener("click", function(){ $("in").value = ""; show(""); $("msg").textContent = ""; });
  $("cp").addEventListener("click", function(){
    if (!lastResult){ $("msg").innerHTML = '<span class="err">' + (T.lang()==="zh"?"没有可复制的内容":"Nothing to copy") + '</span>'; return; }
    T.copy(lastResult, this);
  });
  $("dl").addEventListener("click", function(){
    if (!lastResult){ $("msg").innerHTML = '<span class="err">' + (T.lang()==="zh"?"没有可下载的内容":"Nothing to download") + '</span>'; return; }
    T.download(lastResult, "data.json", "application/json;charset=utf-8");
  });

  // Ctrl+Enter 快速格式化
  $("in").addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); fmt(); }
  });

  window.onLangChange = function(){ $("msg").textContent = ""; };
})();
</script>
</body></html>
