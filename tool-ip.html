<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IP Info · iLONG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8D%89%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="tools.css">
<style>
.ipcard{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.ipcard .flag{display:flex;align-items:center;font-size:34px;line-height:1}
.ipcard .flagimg{display:block;width:44px;height:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.ipcard .addr{font-family:Consolas,monospace;font-size:25px;font-weight:700;letter-spacing:.4px;line-height:1.2}
.ipcard .ty{font-size:11px;font-weight:700;color:#0f9d58;background:#e9f7ef;padding:3px 9px;border-radius:20px;letter-spacing:.3px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.row{background:#fafbfc;border:1px solid #eef0f3;border-radius:10px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.row.wide{grid-column:1/-1}
.row .k{font-size:12px;color:#9aa0a6;white-space:nowrap}
.row .v{font-size:13.5px;font-weight:600;color:#1f2328;text-align:right;word-break:break-word}
.row .v.mono{font-family:Consolas,monospace;font-weight:500}
.row .v small{display:block;font-weight:400;color:#9aa0a6;font-size:11.5px;margin-top:2px}
.loading{text-align:center;padding:34px 0;color:#b0b5ba;font-size:13px}
.dotpulse::after{content:"";animation:dp 1.2s steps(4,end) infinite}
@keyframes dp{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media(max-width:720px){.rows{grid-template-columns:1fr}.row .v{text-align:left}.ipcard .addr{font-size:20px}}
</style>
</head><body>
<div class="wrap">

  <div class="hd">
    <div class="lang">
      <button type="button" data-lang="en" class="on">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
    <a class="back" href="index.html">← <span data-zh="返回首页" data-en="Back to home">返回首页</span></a>
    <h1 data-zh="IP 信息" data-en="IP Information">IP 信息</h1>
    <div class="desc" data-zh="查看当前公网 IP 及归属地、网络运营商、ASN 与时区等公开信息。所有数据在浏览器中直接获取，不经过本站服务器。" data-en="Public IP with location, ISP, ASN and timezone. All data is fetched directly in your browser, never through this site.">查看当前公网 IP 及归属地、网络运营商、ASN 与时区等公开信息。所有数据在浏览器中直接获取，不经过本站服务器。</div>
  </div>

  <div class="panel">
    <div id="body">
      <div class="loading"><span data-zh="正在获取" data-en="Loading">正在获取</span><span class="dotpulse"></span></div>
    </div>

    <div class="btns" id="tools" style="display:none">
      <button class="btn ghost small" id="cpip" data-zh="复制 IP" data-en="Copy IP">复制 IP</button>
      <button class="btn ghost small" id="cpall" data-zh="复制全部信息" data-en="Copy all">复制全部信息</button>
      <button class="btn primary small" id="reload" data-zh="重新获取" data-en="Refresh">重新获取</button>
    </div>

    <div class="hint" id="msg"></div>
    <div class="hint" data-zh="数据来自第三方公开接口，归属地精确到城市级别，仅供参考。若显示为机房或代理地址，说明你的出口可能经过 VPN 或运营商 NAT。" data-en="Data from third-party public APIs, city-level accuracy, for reference only. A data-centre or proxy result usually means your traffic goes through a VPN or carrier NAT.">数据来自第三方公开接口，归属地精确到城市级别，仅供参考。若显示为机房或代理地址，说明你的出口可能经过 VPN 或运营商 NAT。</div>
  </div>

  <div class="ft"><a href="index.html">www.ilong.dpdns.org</a></div>
</div>

<script src="tools.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var T = window.IlongTools;
  var data = null;

  // 三个公开源，依次尝试，字段归一化
  var SOURCES = [
    {
      url: "https://ipwho.is/",
      parse: function(j){
        if (!j || j.success === false) throw new Error("bad");
        return {
          ip: j.ip, type: j.type || "",
          country: j.country, cc: j.country_code,
          region: j.region, city: j.city, postal: j.postal || "",
          lat: j.latitude, lon: j.longitude,
          asn: (j.connection && j.connection.asn) ? "AS" + j.connection.asn : "",
          isp: (j.connection && j.connection.isp) || "",
          org: (j.connection && j.connection.org) || "",
          domain: (j.connection && j.connection.domain) || "",
          tz: (j.timezone && j.timezone.id) || "",
          tzabbr: (j.timezone && j.timezone.abbr) || ""
        };
      }
    },
    {
      url: "https://ipinfo.io/json",
      parse: function(j){
        if (!j || !j.ip) throw new Error("bad");
        var loc = (j.loc || "").split(",");
        var org = j.org || "";
        var m = org.match(/^(AS\d+)\s*(.*)$/);
        return {
          ip: j.ip, type: j.ip.indexOf(":") >= 0 ? "IPv6" : "IPv4",
          country: "", cc: j.country || "",
          region: j.region || "", city: j.city || "", postal: j.postal || "",
          lat: loc[0] ? parseFloat(loc[0]) : "", lon: loc[1] ? parseFloat(loc[1]) : "",
          asn: m ? m[1] : "", isp: m ? m[2] : org, org: org, domain: "",
          tz: j.timezone || "", tzabbr: ""
        };
      }
    },
    {
      url: "https://ip-api.com/json/?fields=status,country,countryCode,regionName,city,zip,lat,lon,timezone,isp,org,as,query",
      parse: function(j){
        if (!j || j.status !== "success") throw new Error("bad");
        var asn = j.as || "";
        var m = asn.match(/^(AS\d+)\s*(.*)$/);
        return {
          ip: j.query, type: j.query.indexOf(":") >= 0 ? "IPv6" : "IPv4",
          country: j.country || "", cc: j.countryCode || "",
          region: j.regionName || "", city: j.city || "", postal: j.zip || "",
          lat: j.lat, lon: j.lon,
          asn: m ? m[1] : "", isp: j.isp || "", org: j.org || "", domain: "",
          tz: j.timezone || "", tzabbr: ""
        };
      }
    }
  ];

  // Windows 不渲染国旗 emoji（只显示 AE / US 这类两位字母），
  // 所以这里一律用国旗 SVG 图片，和显示国旗的地方保持一致。
  function flagImg(cc){
    if (!cc || cc.length !== 2) return "";
    var c = cc.toLowerCase();
    return '<img class="flagimg" alt="' + cc.toUpperCase() + '" ' +
      'src="https://flagcdn.com/' + c + '.svg" ' +
      'onerror="this.style.display=\'none\'">';
  }

  function rows(d){
    var zh = T.lang() === "zh";
    var flag = flagImg(d.cc) || "🌐";
    var coords = (d.lat !== "" && d.lon !== "") ? (Number(d.lat).toFixed(4) + ", " + Number(d.lon).toFixed(4)) : "—";
    var place = [d.country, d.region, d.city].filter(function(x){ return x && x !== d.country || x === d.country; }).filter(Boolean);
    var loc = [d.city, d.region, d.country].filter(Boolean).join(", ") || "—";

    function row(kz, ke, v, mono, sub){
      return '<div class="row"><div class="k">' + (zh ? kz : ke) + '</div><div class="v' + (mono ? " mono" : "") + '">' +
        (v || "—") + (sub ? "<small>" + sub + "</small>" : "") + "</div></div>";
    }
    function wide(kz, ke, v, mono, sub){
      return '<div class="row wide"><div class="k">' + (zh ? kz : ke) + '</div><div class="v' + (mono ? " mono" : "") + '">' +
        (v || "—") + (sub ? "<small>" + sub + "</small>" : "") + "</div></div>";
    }

    return '' +
      '<div class="ipcard">' +
        '<div class="flag">' + flag + '</div>' +
        '<div class="addr" id="ipval">' + (d.ip || "—") + '</div>' +
        (d.type ? '<div class="ty">' + d.type + '</div>' : '') +
      '</div>' +
      '<div class="rows">' +
        row("国家 / 地区", "Country", (d.country || "—") + (d.cc ? " (" + d.cc + ")" : ""), false) +
        row("城市", "City", d.city || "—", false) +
        row("省 / 州", "Region", d.region || "—", false) +
        row("邮编", "Postal code", d.postal || "—", true) +
        wide("完整位置", "Location", loc, false) +
        row("网络运营商", "ISP", d.isp || "—", false) +
        row("ASN", "ASN", d.asn || "—", true) +
        row("组织", "Organisation", d.org || "—", false) +
        row("时区", "Timezone", (d.tz || "—") + (d.tzabbr ? " (" + d.tzabbr + ")" : ""), true) +
        row("经纬度", "Coordinates", coords, true) +
        (d.domain ? row("域名", "Domain", d.domain, true) : "") +
      '</div>';
  }

  function fail(msg){
    $("body").innerHTML = '<div class="loading" style="color:#c0392b">' +
      (T.lang() === "zh" ? "获取失败：" : "Failed to load: ") + msg + "</div>";
    $("tools").style.display = "flex";
  }

  function tryFrom(i){
    if (i >= SOURCES.length){ fail(T.lang() === "zh" ? "所有数据源均不可用" : "all sources unavailable"); return; }
    var s = SOURCES[i];
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, 9000);

    fetch(s.url, {signal: ctl ? ctl.signal : undefined, cache: "no-store"})
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){
        clearTimeout(timer);
        data = s.parse(j);
        $("body").innerHTML = rows(data);
        $("tools").style.display = "flex";
      })
      .catch(function(){ clearTimeout(timer); tryFrom(i + 1); });
  }

  function query(){
    $("body").innerHTML = '<div class="loading"><span>' + (T.lang() === "zh" ? "正在获取" : "Loading") +
      '</span><span class="dotpulse"></span></div>';
    $("msg").textContent = "";
    data = null;
    tryFrom(0);
  }

  $("cpip").addEventListener("click", function(){
    if (!data || !data.ip) return;
    T.copy(data.ip, this);
  });
  $("cpall").addEventListener("click", function(){
    if (!data) return;
    var lines = [
      "IP: " + data.ip,
      "Type: " + data.type,
      "Country: " + [data.country, data.cc].filter(Boolean).join(" "),
      "Region: " + data.region,
      "City: " + data.city,
      "Postal: " + data.postal,
      "ISP: " + data.isp,
      "ASN: " + data.asn,
      "Org: " + data.org,
      "Timezone: " + data.tz + (data.tzabbr ? " (" + data.tzabbr + ")" : ""),
      "Coordinates: " + data.lat + ", " + data.lon
    ];
    T.copy(lines.join("\n"), this);
  });
  $("reload").addEventListener("click", function(){ query(); });

  window.onLangChange = function(){
    if (data) $("body").innerHTML = rows(data);
    else if ($("body").querySelector(".loading")) { /* 查询中，保持 */ }
  };

  query();
})();
</script>
</body></html>
